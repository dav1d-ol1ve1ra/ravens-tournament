<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organiser Login | Ravens Tournament</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1f2937; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1rem; }
    main { max-width: 420px; margin: 8vh auto 0; padding: 1.5rem; background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label { display: block; margin: 1rem 0 0.35rem; font-weight: 650; }
    input { width: 100%; min-height: 3rem; padding: 0.65rem; border: 1px solid #94a3b8; border-radius: 0.45rem; font: inherit; }
    button { width: 100%; min-height: 3rem; margin-top: 1.25rem; border: 0; border-radius: 0.45rem; color: white; background: #27124d; font: inherit; font-weight: 700; }
    .errorlist { color: #b91c1c; }
  </style>
</head>
<body>
  <main>
    <h1>Organiser Login</h1>
    {% if form.errors %}<p>Please check your username and password.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="{{ form.username.id_for_label }}">Username</label>
      {{ form.username }}
      <label for="{{ form.password.id_for_label }}">Password</label>
      {{ form.password }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
